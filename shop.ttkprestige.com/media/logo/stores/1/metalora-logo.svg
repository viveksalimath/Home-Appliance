<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="60%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#8E0000" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0E0E0" />
      <stop offset="70%" stop-color="#9E9E9E" />
      <stop offset="100%" stop-color="#616161" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFDF73" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C62828" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagonal Frame -->
    <rect x="2" y="2" width="76" height="76" rx="18" fill="url(#rubyGrad)" filter="url(#subtleGlow)" />
    <rect x="5" y="5" width="70" height="70" rx="15" fill="none" stroke="url(#chromeGrad)" stroke-width="1.8" opacity="0.6" />
    
    <!-- Stylized Modern M -->
    <path d="M 22 60 L 22 25 L 34 44 L 40 35 L 46 44 L 58 25 L 58 60 L 51 60 L 51 37 L 43 50 L 37 50 L 29 37 L 29 60 Z" fill="#FFFFFF" />
    
    <!-- Radiant Diamond / Flame Spark at top center -->
    <path d="M 40 18 L 43 23 L 40 28 L 37 23 Z" fill="url(#goldAccent)" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title: METALORA -->
  <text x="106" y="52" font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="4" fill="#1C1C1E">
    METAL<tspan fill="url(#rubyGrad)">O</tspan>RA
  </text>

  <!-- Elegant Tagline -->
  <text x="108" y="73" font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.2" fill="#757575">
    PREMIUM COOKWARE &amp; APPLIANCES
  </text>
  
  <!-- Subtle metallic underline bar -->
  <rect x="108" y="80" width="220" height="2" rx="1" fill="url(#rubyGrad)" opacity="0.85" />
</svg>
